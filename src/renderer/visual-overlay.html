<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Visual Overlay</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    
    #ambient-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      display: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #xray-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      display: none;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }


    
    #waterfall-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      display: none;
    }

    .waterfall-item {
      position: absolute;
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      border-radius: 8px;
      will-change: transform;
    }

    #flash-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: none;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <div id="ambient-layer"></div>
  <div id="xray-layer"></div>
  <div id="waterfall-layer"></div>
  <div id="flash-layer"></div>

  <script src="./visual-overlay.js"></script>
</body>
</html>
