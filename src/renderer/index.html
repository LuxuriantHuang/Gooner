<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gooner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bar">
  <div class="bar-inner">
    <div class="brand"><span class="mark">G</span>GOONER</div>
    <div class="bar-center">
      <div class="bar-profile-group">
        <select id="barProfileSelect" class="bar-profile-select" title="快速切换配置档案"></select>
        <button id="barSaveConfigAsBtn" class="bar-save-btn" title="另存为新配置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="bar-actions">
      <button class="icon-btn" id="btnSettings" title="全局设置">⚙</button>
      <button class="icon-btn" id="minimizeWindowButton" title="最小化">–</button>
      <button class="icon-btn" id="closeWindowButton" title="关闭">✕</button>
    </div>
  </div>
</div>

<main class="app">
  <section class="hero">
    <div class="hero-left">
      <button id="heroFoldersButton" class="hero-folders-btn" title="媒体文件夹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 2h9v10H3Z"/></svg></button>
      <div id="mediaPathWarning" class="media-path-warning" hidden></div>
    </div>
    <div class="hero-progress" id="heroProgress" title="点击查看生涯详情" style="cursor:pointer">
      <div class="progress-box"><div class="progress-label"><span id="heroDailyLabel">今日印章</span> <span id="dailyStampText" class="daily-stamp-text"></span><span id="dailyProgressText">0 / 1h</span></div>
      <div class="progress-track"><div class="progress-fill" id="dailyProgressFill" style="width:0%"></div></div></div>
      <div class="progress-box"><div class="progress-label"><span id="heroMonthlyLabel">本月大满贯</span><span id="monthlyProgressText">0 / 30 天</span></div>
      <div class="progress-track"><div class="progress-fill fill-monthly" id="monthlyProgressFill" style="width:0%"></div></div></div>
    </div>
    <div>
      <div class="pills" style="margin-bottom:4px">
        <button id="startButton" class="go"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6,3 20,12 6,21"/></svg><span>启动</span></button>
        <button id="pauseButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="5" height="18"/><rect x="14" y="3" width="5" height="18"/></svg><span>暂停</span></button>
        <button id="stopButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg><span>停止</span></button>
        <button id="closeAllButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg><span>关闭全部</span></button>
      </div>
      <div class="pills">
        <button id="saveButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span>保存</span></button>
      </div>
    </div>
  </section>

  <div id="statsInlinePanel" class="stats-inline-panel" hidden>
    <div class="stats-inline-head">
      <h3>生涯概览</h3>
      <button id="statsInlineCloseBtn" class="stats-inline-close" title="收起">✕</button>
    </div>
    <div class="stats-grid"><div class="stat-card"><div class="stat-label">总播放时长</div><div class="stat-value" id="statPlayTime">-</div></div>
    <div class="stat-card"><div class="stat-label">总运行时长</div><div class="stat-value" id="statUptime">-</div></div>
    <div class="stat-card"><div class="stat-label">单次最长</div><div class="stat-value" id="statLongestSession">-</div></div>
    <div class="stat-card"><div class="stat-label">日均播放</div><div class="stat-value" id="statDailyAverage">-</div></div></div>
    <div class="stats-grid stats-grid-secondary" style="margin-top:8px">
    <div class="stat-card"><div class="stat-label">弹窗记录</div><div class="stat-sub-values">
      <span>图片: <span id="statPopupImage" class="stat-accent">0</span></span>
      <span>视频: <span id="statPopupVideo" class="stat-accent">0</span></span>
      <span>网站: <span id="statPopupWebsite" class="stat-accent">0</span></span>
      <span>AI 互动: <span id="statPopupAi" class="stat-accent">0</span></span>
    </div></div>
    <div class="stat-card"><div class="stat-label">操作习惯</div><div class="stat-sub-values">
      <span>手动关闭: <span id="statCloseManual" class="stat-accent">0</span></span>
      <span>自动关闭: <span id="statCloseAuto" class="stat-accent">0</span></span>
    </div></div></div>
    <div style="margin-top:12px">
      <div class="calendar-header"><button id="prevMonthBtn" class="calendar-nav-btn">&lt;</button>
      <h3 id="calendarMonthLabel" class="calendar-title"></h3><button id="nextMonthBtn" class="calendar-nav-btn">&gt;</button></div>
      <div class="calendar-days-header"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="calendar-wrapper"><div id="calendarGrid" class="calendar-grid"></div>
      <div id="fullMonthStamp" class="full-month-stamp hidden"><div class="stamp-inner" id="fullMonthStampText">大满贯</div></div></div>
    </div>
  </div>

  <div id="dashboard"></div>
  <div id="detail-view" style="display:none;">
    <div class="detail-bar">
      <button id="detailBackBtn" class="detail-back">← 返回总控台</button>
      <span id="detailTitle" class="detail-title"></span>
      <span></span>
    </div>
    <div id="detailContent" class="detail-content"></div>
  </div>
</main>

<footer class="statusbar">
  <div class="status-left">
    <span id="statusIndicator">调度器就绪</span>
    <span id="statusWindowCount">0 个窗口</span>
    <span id="statusMediaCount">0 项媒体</span>
  </div>
  <span id="statusVersion">v0.2.0</span>
  <span id="statusScheduler" style="display:none;"></span>
</footer>

<textarea id="logOutput" style="display:none;" readonly></textarea>

<!-- 进程选择器 -->
<div id="processPickerOverlay" class="modal-overlay" hidden>
  <div class="modal-panel process-picker-modal">
    <div class="modal-head">
      <h3 id="processPickerTitle">选择运行中进程</h3>
      <button id="processPickerCloseButton" class="modal-close">✕</button>
    </div>
    <input id="processPickerSearch" type="text" placeholder="输入进程名过滤" class="modal-search">
    <div id="processPickerList" class="process-picker-list"></div>
    <div class="modal-foot">
      <span id="processPickerStatus"></span>
      <button id="processPickerRefreshButton">刷新</button>
      <button id="processPickerAddButton" class="primary">添加选中进程</button>
    </div>
  </div>
</div>

<!-- 强控确认 -->
<div id="hardcoreModalOverlay" class="modal-overlay" hidden>
  <div class="modal-panel">
    <h3>确认开启强控模式</h3>
    <p>开启后主窗口和任务栏图标将完全隐藏。请输入 <strong id="hardcoreTargetText"></strong> 确认：</p>
    <input id="hardcoreInput" type="text" autocomplete="off">
    <p id="hardcoreErrorText" class="error-text" hidden></p>
    <div class="modal-actions">
      <button id="hardcoreCancelBtn">取消</button>
      <button id="hardcoreConfirmBtn" class="danger">确认开启</button>
    </div>
  </div>
</div>

<!-- 重命名对话框 -->
<div id="renameDialog" class="modal-overlay" hidden>
  <div class="modal-panel">
    <h3>编辑档案名</h3>
    <input id="renameInput" type="text">
    <div class="modal-actions">
      <button id="renameBtnCancel">取消</button>
      <button id="renameBtnConfirm" class="primary">确认</button>
    </div>
    <button id="renameDialogClose" class="modal-close">✕</button>
  </div>
</div>

<!-- 角色卡选择 -->
<div id="aiCardModal" class="modal-overlay" hidden>
  <div class="modal-panel card-modal">
    <div class="modal-head">
      <h3 id="aiCardModalTitle">选择角色卡</h3>
      <button id="aiCardModalClose" class="modal-close">✕</button>
    </div>
    <div id="aiCardGrid" class="card-grid"></div>
  </div>
</div>

<!-- 头像裁剪 -->
<div id="aiAvatarCropperModal" class="modal-overlay" hidden>
  <div class="modal-panel cropper-modal">
    <h3>裁剪头像</h3>
    <canvas id="aiCropperCanvas"></canvas>
    <div class="modal-actions">
      <button id="aiBtnCancelAvatarCrop">取消</button>
      <button id="aiBtnSaveAvatarCrop" class="primary">保存</button>
    </div>
    <button id="aiCropperModalClose" class="modal-close">✕</button>
  </div>
</div>

<script src="../shared/i18n.js"></script>
<script src="vendor/simplepeer.min.js"></script>
<script src="peer-share.js"></script>
<script src="app.js"></script>
</body>
</html>
