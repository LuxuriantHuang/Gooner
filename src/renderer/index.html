<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gooner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bar">
  <div class="bar-inner">
    <div class="brand"><span class="mark">G</span>GOONER</div>
    <div class="bar-center">
      <div class="bar-profile-group">
        <select id="barProfileSelect" class="bar-profile-select" data-i18n-title="config.profile.quickSwitch"></select>
        <button id="barSaveConfigAsBtn" class="bar-save-btn" data-i18n-title="config.profile.saveAs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="bar-actions">
      <button class="icon-btn" id="btnSettings" data-i18n-title="settings.global">⚙</button>
      <button class="icon-btn" id="minimizeWindowButton" data-i18n-title="buttons.minimize">–</button>
      <button class="icon-btn" id="closeWindowButton" data-i18n-title="buttons.close">✕</button>
    </div>
  </div>
</div>

<main class="app">
  <section class="hero">
    <div class="hero-left">
      <button id="heroFoldersButton" class="hero-folders-btn" data-i18n-title="folders.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 2h9v10H3Z"/></svg></button>
      <div id="mediaPathWarning" class="media-path-warning" hidden></div>
    </div>
    <div class="hero-progress" id="heroProgress" data-i18n-title="stats.panel.title" style="cursor:pointer">
      <div class="progress-box"><div class="progress-label"><span id="heroDailyLabel" data-i18n="dashboard.dailyProgress"></span> <span id="dailyStampText" class="daily-stamp-text"></span><span id="dailyProgressText">0 / 1h</span></div>
      <div class="progress-track"><div class="progress-fill" id="dailyProgressFill" style="width:0%"></div></div></div>
      <div class="progress-box"><div class="progress-label"><span id="heroMonthlyLabel" data-i18n="dashboard.monthlyProgress"></span><span id="monthlyProgressText">0 / 30</span></div>
      <div class="progress-track"><div class="progress-fill fill-monthly" id="monthlyProgressFill" style="width:0%"></div></div></div>
    </div>
    <div>
      <div class="pills" style="margin-bottom:4px">
        <button id="startButton" class="go"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6,3 20,12 6,21"/></svg><span data-i18n="buttons.start"></span></button>
        <button id="pauseButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="5" height="18"/><rect x="14" y="3" width="5" height="18"/></svg><span data-i18n="buttons.pause"></span></button>
        <button id="stopButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg><span data-i18n="buttons.stop"></span></button>
        <button id="closeAllButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg><span data-i18n="buttons.closeAll"></span></button>
      </div>
      <div class="pills">
        <button id="saveButton"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span data-i18n="buttons.save"></span></button>
      </div>
    </div>
  </section>

  <div id="statsInlinePanel" class="stats-inline-panel" hidden>
    <div class="stats-inline-head">
      <h3 data-i18n="stats.panel.title"></h3>
      <button id="statsInlineCloseBtn" class="stats-inline-close" data-i18n-title="buttons.collapse">✕</button>
    </div>
    <div class="stats-grid">    <div class="stat-card"><div class="stat-label" data-i18n="stats.totalPlayTime"></div><div class="stat-value" id="statPlayTime">-</div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="stats.totalUptime"></div><div class="stat-value" id="statUptime">-</div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="stats.longestSession"></div><div class="stat-value" id="statLongestSession">-</div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="stats.dailyAverage"></div><div class="stat-value" id="statDailyAverage">-</div></div></div>
    <div class="stats-grid stats-grid-secondary" style="margin-top:8px">
    <div class="stat-card"><div class="stat-label" data-i18n="stats.popups"></div><div class="stat-sub-values">
      <span><span data-i18n="stats.popup.image"></span>: <span id="statPopupImage" class="stat-accent">0</span></span>
      <span><span data-i18n="stats.popup.video"></span>: <span id="statPopupVideo" class="stat-accent">0</span></span>
      <span><span data-i18n="stats.popup.website"></span>: <span id="statPopupWebsite" class="stat-accent">0</span></span>
      <span><span data-i18n="stats.popup.ai"></span>: <span id="statPopupAi" class="stat-accent">0</span></span>
    </div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="stats.closes"></div><div class="stat-sub-values">
      <span><span data-i18n="stats.close.manual"></span>: <span id="statCloseManual" class="stat-accent">0</span></span>
      <span><span data-i18n="stats.close.auto"></span>: <span id="statCloseAuto" class="stat-accent">0</span></span>
    </div></div></div>
    <div style="margin-top:12px">
      <div class="calendar-header"><button id="prevMonthBtn" class="calendar-nav-btn">&lt;</button>
      <h3 id="calendarMonthLabel" class="calendar-title"></h3><button id="nextMonthBtn" class="calendar-nav-btn">&gt;</button></div>
      <div class="calendar-days-header"><span data-i18n="calendar.sun"></span><span data-i18n="calendar.mon"></span><span data-i18n="calendar.tue"></span><span data-i18n="calendar.wed"></span><span data-i18n="calendar.thu"></span><span data-i18n="calendar.fri"></span><span data-i18n="calendar.sat"></span></div>
      <div class="calendar-wrapper"><div id="calendarGrid" class="calendar-grid"></div>
      <div id="fullMonthStamp" class="full-month-stamp hidden"><div class="stamp-inner" id="fullMonthStampText" data-i18n="stamp.fullMonth"></div></div></div>
    </div>
  </div>

  <div id="dashboard"></div>
  <div id="detail-view" style="display:none;">
    <div class="detail-bar">
      <button id="detailBackBtn" class="detail-back">← <span data-i18n="buttons.back"></span></button>
      <span id="detailTitle" class="detail-title"></span>
      <span></span>
    </div>
    <div id="detailContent" class="detail-content"></div>
  </div>
</main>

<footer class="statusbar">
  <div class="status-left">
    <span id="statusIndicator" data-i18n="status.ready"></span>
    <span id="statusWindowCount" data-i18n="stats.popupCount" data-i18n-params='{"count":0}'></span>
    <span id="statusMediaCount" data-i18n="stats.mediaCount" data-i18n-params='{"count":0}'></span>
  </div>
  <span id="statusVersion">v0.2.0</span>
  <span id="statusScheduler" style="display:none;"></span>
</footer>

<textarea id="logOutput" style="display:none;" readonly></textarea>

<!-- 进程选择器 -->
<div id="processPickerOverlay" class="modal-overlay" hidden>
  <div class="modal-panel process-picker-modal">
    <div class="modal-head">
      <h3 id="processPickerTitle" data-i18n="processRules.pickerTitle"></h3>
      <button id="processPickerCloseButton" class="modal-close" data-i18n-title="buttons.close">✕</button>
    </div>
    <input id="processPickerSearch" type="text" data-i18n-placeholder="processRules.searchPlaceholder" class="modal-search">
    <div id="processPickerList" class="process-picker-list"></div>
    <div class="modal-foot">
      <span id="processPickerStatus"></span>
      <button id="processPickerRefreshButton" data-i18n="processRules.refresh"></button>
      <button id="processPickerAddButton" class="primary" data-i18n="processRules.addSelected"></button>
    </div>
  </div>
</div>

<!-- 强控确认 -->
<div id="hardcoreModalOverlay" class="modal-overlay" hidden>
  <div class="modal-panel">
    <h3 data-i18n="hardcore.confirmTitle"></h3>
    <p><span data-i18n="hardcore.confirmNote"></span> <strong id="hardcoreTargetText"></strong> <span data-i18n="hardcore.confirmSuffix"></span></p>
    <input id="hardcoreInput" type="text" autocomplete="off">
    <p id="hardcoreErrorText" class="error-text" hidden></p>
    <div class="modal-actions">
      <button id="hardcoreCancelBtn" data-i18n="buttons.cancel"></button>
      <button id="hardcoreConfirmBtn" class="danger" data-i18n="hardcore.confirm"></button>
    </div>
  </div>
</div>

<!-- 静默模式防误开启确认 -->
<div id="silentModeModalOverlay" class="modal-overlay" hidden>
  <div class="modal-panel">
    <h3 data-i18n="silent.confirmTitle"></h3>
    <p id="silentModeWarningText"></p>
    <div id="silentModeChallenge" hidden>
      <p><span data-i18n="silent.challengePrompt"></span> <strong id="silentModeQuestion"></strong></p>
      <input id="silentModeAnswer" type="number" inputmode="numeric" autocomplete="off" data-i18n-placeholder="silent.answerPlaceholder">
      <p id="silentModeErrorText" class="error-text" hidden></p>
    </div>
    <div class="modal-actions">
      <button id="silentModeCancelBtn" data-i18n="buttons.cancel"></button>
      <button id="silentModeNextBtn" class="danger" data-i18n="silent.next"></button>
      <button id="silentModeConfirmBtn" class="danger" data-i18n="silent.confirm" hidden></button>
    </div>
  </div>
</div>

<!-- 重命名对话框 -->
<div id="renameDialog" class="modal-overlay" hidden>
  <div class="modal-panel">
    <h3 data-i18n="config.profile.renameTitle"></h3>
    <input id="renameInput" type="text">
    <div class="modal-actions">
      <button id="renameBtnCancel" data-i18n="buttons.cancel"></button>
      <button id="renameBtnConfirm" class="primary" data-i18n="buttons.confirm"></button>
    </div>
    <button id="renameDialogClose" class="modal-close">✕</button>
  </div>
</div>

<!-- 角色卡选择 -->
<div id="aiCardModal" class="modal-overlay" hidden>
  <div class="modal-panel card-modal">
    <div class="modal-head">
      <h3 id="aiCardModalTitle" data-i18n="ai.card.modalTitle"></h3>
      <button id="aiCardModalClose" class="modal-close">✕</button>
    </div>
    <div id="aiCardGrid" class="card-grid"></div>
  </div>
</div>

<!-- 头像裁剪 -->
<div id="aiAvatarCropperModal" class="modal-overlay" hidden>
  <div class="modal-panel cropper-modal">
    <h3 data-i18n="ai.cropper.title"></h3>
    <canvas id="aiCropperCanvas"></canvas>
    <div class="modal-actions">
      <button id="aiBtnCancelAvatarCrop" data-i18n="ai.cropper.cancel"></button>
      <button id="aiBtnSaveAvatarCrop" class="primary" data-i18n="ai.cropper.save"></button>
    </div>
    <button id="aiCropperModalClose" class="modal-close">✕</button>
  </div>
</div>

<script src="../shared/i18n.js"></script>
<script src="vendor/simplepeer.min.js"></script>
<script src="peer-share.js"></script>
<script src="../shared/shortcut-recorder.js"></script>
<script src="app.js"></script>
</body>
</html>
