<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gooner · 工业矩阵</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--bg:#070909;--surface:#0c1010;--surface2:#111616;--line:#30403d;--line2:#58706b;--text:#f2f7f4;--muted:#a7b7b1;--subtle:#788d85;--accent:#5ff3bb;--ink:#07110d;--danger:#ff9b67;--warn:#f5c842}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-width:1200px;color:var(--text);font-family:"DM Sans","Noto Sans SC",sans-serif;letter-spacing:0;-webkit-font-smoothing:antialiased;background:linear-gradient(rgba(95,243,187,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(95,243,187,.028) 1px,transparent 1px),var(--bg);background-size:28px 28px}button{font:inherit;cursor:pointer}svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── BAR ── */
.bar{position:sticky;z-index:100;top:0;border-bottom:1px solid var(--line);background:rgba(7,9,9,.94);backdrop-filter:blur(14px)}.bar-inner{width:1250px;height:56px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.4px}.mark{width:26px;height:26px;display:grid;place-items:center;color:var(--accent);border:1px solid var(--line2);border-radius:2px;background:var(--surface2);font-size:10px}.page{color:var(--subtle);font-size:11px}.bar-btns{justify-self:end;display:flex;gap:4px}.icon-btn{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border:0;border-radius:2px;background:transparent}.icon-btn:hover{color:var(--text);background:var(--surface)}.icon-btn svg{width:15px;height:15px}

/* ── APP ── */
.app{width:1250px;margin:auto;padding:24px 0 56px}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:28px;padding:28px 0 26px;border-bottom:1px solid var(--line);margin-bottom:22px}
.kicker{margin:0 0 7px;color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}.kicker::before{content:"// "}.hero h1{margin:0;font-size:34px;line-height:1.1;font-weight:600}.hero p{margin:8px 0 0;color:var(--muted);font-size:12px}.pills{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}.pills button{height:32px;padding:0 12px;color:var(--muted);border:0;border-radius:2px;background:transparent;font-size:11px}.pills button:hover{color:var(--text);background:var(--surface2)}.pills .go{color:var(--ink);background:var(--accent);font-weight:700}

/* ── SECTIONS ── */
.sec{margin-top:18px}.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sec-head h2{margin:0;color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.sec-head h2::before{content:"// "}.sec-count{color:var(--subtle);font-size:10px;font-family:Consolas,monospace}

/* ── GRID DEFAULT (5 col) ── */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}

/* ── TILE ── */
.tile{--tc:var(--accent);position:relative;isolation:isolate;min-width:0;aspect-ratio:1.03;padding:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:2px;background:linear-gradient(155deg,var(--surface2),var(--surface));box-shadow:inset 0 1px rgba(255,255,255,.02);transition:transform .16s,border-color .16s}.tile::before{content:"";position:absolute;top:11px;bottom:auto;left:-1px;right:auto;width:3px;height:34px;background:var(--tc);opacity:0;transition:opacity .18s}.tile:hover{z-index:20;transform:translateY(-2px);border-color:var(--line2);box-shadow:0 10px 22px rgba(0,0,0,.28)}.tile.on{border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}.tile.on::before{opacity:1}.tile.danger{--tc:var(--danger)}.tile.warn{--tc:var(--warn)}

.tile-top{display:flex;align-items:flex-start;justify-content:space-between}.glyph{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line2);border-radius:2px;background:var(--surface)}.on .glyph{color:var(--tc);border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}.glyph svg{width:16px;height:16px}.idx{color:var(--subtle);font-size:10px;font-family:Consolas,monospace}.tile h3{margin:13px 0 0;color:var(--text);font-size:13px;font-weight:600;line-height:1.25}.meta{font-family:Consolas,monospace;margin:3px 0 0;color:#82968f;font-size:10px;text-transform:uppercase}.tile-actions{margin-top:auto;display:flex;align-items:center;justify-content:space-between}

.sw{position:relative;width:36px;height:19px;border:1px solid var(--line2);border-radius:2px;background:var(--bg);cursor:pointer;transition:.16s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:11px;height:11px;border-radius:1px;background:var(--muted);transition:.16s}.on .sw{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,var(--bg))}.on .sw::after{transform:translateX(17px);background:var(--tc)}

.link{height:25px;padding:0 7px;display:flex;align-items:center;gap:3px;color:var(--muted);border:1px solid var(--line);border-radius:2px;background:transparent;font-size:10px;font-family:Consolas,monospace}.link:hover{color:var(--text);border-color:var(--line2);background:var(--surface2)}.link svg{width:10px;height:10px}.link svg.flip{transform:rotate(90deg)}

.hint{position:absolute;z-index:50;left:10px;right:10px;bottom:calc(100% + 7px);padding:9px 11px;color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:2px;box-shadow:0 14px 30px rgba(0,0,0,.45);font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(4px);transition:.14s}.hint::after{content:"";position:absolute;top:100%;left:16px;width:7px;height:7px;background:var(--surface2);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:translateY(-4px) rotate(45deg)}.tile:hover .hint{opacity:1;transform:none}

.danger .hint{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.warn .hint{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}

/* ── CORE SECTION (visually distinct) ── */
.core-section{border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:3px;padding:13px;background:color-mix(in srgb,var(--accent) 4%,var(--bg));margin-top:20px}.core-section .sec-head h2{font-size:11px;color:var(--text)}.core-section .sec-head h2::before{content:">> "}

/* ── FOLDER ── */
.folder .tile-actions{justify-content:flex-end}.folder-count{margin-top:auto;color:var(--text);font-size:26px;font-family:Consolas,monospace}.folder-count em{font-style:normal;color:var(--subtle);font-size:10px}

/* ── STATUSBAR ── */
.statusbar{margin-top:26px;padding-top:12px;display:flex;justify-content:space-between;color:var(--muted);border-top:1px solid var(--line);font-size:10px;font-family:Consolas,monospace}.status-left{display:flex;gap:14px}.live{display:flex;align-items:center;gap:5px;color:#bbc9c3}.live::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--accent)}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner"><div class="brand"><span class="mark">G</span>GOONER</div><div class="page">ctrl</div><div class="bar-btns"><button class="icon-btn" title="通知"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><button class="icon-btn" title="全局设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 15l2 2-4 4-2-2-3 1-1 3H6l-1-3-3-1v-5l3-1 1-3-2-2 4-4 2 2 3-1 1-3h5l1 3 3 1v5l-3 1Z"/></svg></button></div></div></div>

<main class="app">
<section class="hero"><div><p class="kicker">control surface</p><h1>一处掌控所有功能。</h1><p>总开关集中管理，详细设置进入次级页面。</p></div><div class="pills"><button class="go">▶ 启动</button><button>⏸ 暂停</button><button>⏹ 停止</button><button>✕ 关闭全部</button></div></section>
<div id="root"></div>
<footer class="statusbar"><div class="status-left"><span class="live">调度器运行中</span><span>3 个窗口</span><span>127 项媒体</span></div><span>v0.1.0</span></footer>
</main>

<script>
const I={bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',folder:'<path d="M3 6h7l2 2h9v10H3Z"/>',image:'<rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0M6 5 4 3M18 5l2-2"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',chat:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4ZM8 10h8M8 14h5"/>',spark:'<path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M16.3 7.7l2.1-2.1M8 16a5 5 0 1 1 8 0l-2 2v2h-4v-2Z"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',ghost:'<path d="M9 3h6l1 4H8Zm-6 18 4-4 4 4 4-4 4 4 4-4v4H3Z"/>',xray:'<circle cx="12" cy="12" r="8" opacity=".6"/><circle cx="12" cy="12" r="3"/><path d="M3 12h2M19 12h2M12 3v2M12 19v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M16.3 7.7l-1.4 1.4M7.7 16.3l-1.4 1.4"/>',fall:'<rect x="8" y="2" width="8" height="10" rx="1"/><path d="M12 12v3M10 18l2 2 2-2M8 8h2M14 8h2"/>',flash:'<path d="M13 2 3 14h6l-2 8 10-12h-6l2-8Z"/>',keyboard:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h1M15 10h1M8 14h8"/>',shield:'<path d="M12 3 4 6v5c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6Zm-3 9 2 2 4-4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',monitor:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4M8 10h8M13 7l3 3-3 3"/>',hidden:'<path d="M3 12s4-7 9-7c2 0 3.8 1 5.3 2.2M21 12s-4 7-9 7c-2 0-3.8-1-5.3-2.2M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/>'};
function icon(name){return'<svg viewBox="0 0 24 24">'+I[name]+'</svg>'}
function arrow(flip){return'<svg class="'+(flip?'flip':'')+'" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>'}
let n=0;function idx(){n++;return'<span class="idx">'+String(n).padStart(2,'0')+'</span>'}

function tile(o){// {name,meta,icon,hint,on,tone,count}
  var cls='tile'+(o.on?' on':'')+(o.tone?' '+o.tone:'');
  var bot=o.count
    ?'<div class="folder-count">'+o.count+'</div><div class="tile-actions"><span></span><button class="link">管理 '+arrow(false)+'</button></div>'
    :'<div class="tile-actions"><button class="sw" aria-label="'+(o.on?'关闭':'开启')+o.name+'"></button><button class="link">设置 '+arrow(false)+'</button></div>';
  return'<article class="'+cls+'"><div class="hint">'+o.hint+'</div><div class="tile-top"><span class="glyph">'+icon(o.icon)+'</span>'+idx()+'</div><h3>'+o.name+'</h3><p class="meta">'+o.meta+'</p>'+bot+'</article>';
}

var sections=[
  ['核心功能',{cls:'core-section',cols:5,items:[
    {name:'媒体弹窗',meta:'popup.engine',icon:'bell',hint:'全局总开关。关闭后停止创建新弹窗，并关闭当前所有媒体窗口。',on:true},
    {name:'自动换壁纸',meta:'wallpaper',icon:'image',hint:'按设定间隔从媒体库中选择合适图片，自动更换桌面壁纸。',on:false},
    {name:'AI 文本弹窗',meta:'gen.text',icon:'chat',hint:'生成短文本并以独立窗口展示，可配置提示词、频率和弹窗外观。',on:true},
    {name:'幽灵底片',meta:'ghost.gallery',icon:'ghost',hint:'半透明图片持续覆盖屏幕，按设定间隔自动切换新图片。可调透明度和切换频率。',on:false},
    {name:'X 光模式',meta:'xray.reveal',icon:'xray',hint:'鼠标周围圆形区域显示完整图片，其余部分被遮罩。可调半径和遮罩透明度。',on:false},
    {name:'媒体瀑布',meta:'media.waterfall',icon:'fall',hint:'图片从屏幕顶部持续下落，可调速度、数量、大小和透明度。',on:false},
    {name:'潜意识闪烁',meta:'subliminal.flash',icon:'flash',hint:'按随机间隔在屏幕上短暂闪烁图片。⚠ 光敏性癫痫患者请勿开启。',on:false,tone:'danger'},
    {name:'输入干预',meta:'input.control',icon:'keyboard',hint:'剪贴板污染 + 输入框注入。所有细分能力可在详情中单独开关。',on:false}
  ]}],
  ['媒体管理',{cols:5,items:[
    {name:'媒体文件夹',meta:'local.library',icon:'folder',hint:'管理本地图片和视频文件夹。这里是所有弹窗素材的主要来源。',count:'3 <em>个来源</em>'},
    {name:'桌面角色',meta:'character',icon:'user',hint:'在桌面显示透明 PNG 角色图层，支持柔和融合与直接覆盖。',on:false},
    {name:'在线媒体源',meta:'remote.fetch',icon:'globe',hint:'从远程链接列表拉取媒体地址，支持 http / https。',on:false}
  ]}],
  ['智能与系统',{cols:5,items:[
    {name:'主动互动',meta:'auto.interact',icon:'spark',hint:'根据预设上下文定时生成主动互动内容，频率可在详情中调整。',on:false},
    {name:'进程规则',meta:'process.gate',icon:'shield',hint:'根据运行中软件的允许/排除名单，自动启停弹窗调度。',on:false},
    {name:'强控模式',meta:'restricted.ui',icon:'lock',hint:'隐藏主窗口和任务栏。请先配置全局快捷键，确保始终可恢复控制。',on:false,tone:'danger'},
    {name:'开机自启',meta:'auto.launch',icon:'monitor',hint:'Windows 登录后自动运行应用，可在系统设置中随时关闭。',on:false},
    {name:'静默模式',meta:'silent.boot',icon:'hidden',hint:'启动后自动收起主窗口。通知区图标和快捷键仍可用于控制。',on:false}
  ]}]
];

document.getElementById('root').innerHTML=sections.map(function(s){
  var head=s[0],cfg=s[1];
  return'<section class="sec'+(cfg.cls?' '+cfg.cls:'')+'"><div class="sec-head"><h2>'+head+'</h2><span class="sec-count">'+cfg.items.length+' modules</span></div><div class="grid">'+cfg.items.map(tile).join('')+'</div></section>';
}).join('');

document.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){this.closest('.tile').classList.toggle('on')})});
</script>
</body>
</html>
